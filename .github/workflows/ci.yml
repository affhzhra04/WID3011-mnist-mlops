name: CI — MNIST MLOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Train, Export, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install CPU-only PyTorch and dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Train model (3 epochs)
        run: python -m src.train

      - name: Export to ONNX
        run: python -m src.export_onnx

      - name: Run all tests
        run: pytest tests/ -v --tb=short

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t mnist-api:ci .

      - name: Smoke test container
        run: |
          docker run -d -p 8000:8000 --name mnist-test mnist-api:ci
          sleep 5
          curl -f http://localhost:8000/health
          docker stop mnist-test
